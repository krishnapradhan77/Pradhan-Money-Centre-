<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Get Access</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 10%, rgba(16,185,129,0.18), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(59,130,246,0.16), transparent 30%),
                linear-gradient(135deg, #020617 0%, #071b1c 50%, #020617 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: -1;
            animation: floatingLight 8s ease-in-out infinite;
        }

        body::before {
            background: rgba(16,185,129,0.22);
            top: -100px;
            left: -100px;
        }

        body::after {
            background: rgba(59,130,246,0.18);
            right: -100px;
            bottom: -100px;
            animation-delay: -4s;
        }

        @keyframes floatingLight {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -20px) scale(1.12);
            }
        }

        .premium-card {
            position: relative;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow:
                0 30px 80px rgba(0,0,0,0.50),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardAppear 0.75s ease-out;
        }

        .premium-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(16,185,129,0.10);
            filter: blur(45px);
            top: -90px;
            right: -70px;
            pointer-events: none;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .top-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow:
                0 15px 35px rgba(16,185,129,0.28),
                inset 0 1px 0 rgba(255,255,255,0.25);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 11px;
            border-radius: 999px;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.20);
            color: #34d399;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(52,211,153,0.7);
            }

            70% {
                box-shadow: 0 0 0 7px rgba(52,211,153,0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(52,211,153,0);
            }
        }

        .premium-input {
            transition: all 0.25s ease;
        }

        .premium-input:hover {
            border-color: rgba(100,116,139,0.8);
        }

        .premium-input:focus {
            transform: translateY(-2px);
            border-color: #10b981 !important;
            box-shadow:
                0 0 0 4px rgba(16,185,129,0.10),
                0 10px 30px rgba(0,0,0,0.18);
        }

        .premium-button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow:
                0 12px 30px rgba(16,185,129,0.22),
                inset 0 1px 0 rgba(255,255,255,0.18);
            transition: all 0.25s ease;
        }

        .premium-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.30),
                transparent
            );
            transform: skewX(-20deg);
            animation: buttonShine 3.5s infinite;
        }

        @keyframes buttonShine {
            0% {
                left: -130%;
            }

            35%, 100% {
                left: 150%;
            }
        }

        .premium-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 17px 40px rgba(16,185,129,0.32),
                inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .premium-button:active {
            transform: translateY(0) scale(0.99);
        }

        .premium-button:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 0.75;
        }

        .bottom-info {
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .info-item {
            color: #64748b;
            font-size: 11px;
        }

        .info-check {
            color: #34d399;
            margin-right: 3px;
        }

        @media (max-width: 480px) {
            .premium-card {
                border-radius: 25px;
                padding: 24px !important;
            }

            .top-icon {
                width: 62px;
                height: 62px;
                border-radius: 19px;
            }
        }
    </style>
</head>


<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">


<div class="premium-card max-w-md w-full rounded-[28px] p-8">


    <div class="text-center mb-7">

        <div class="top-icon mb-5">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="M12 2l7 4v6c0 5-3 8-7 10-4-2-7-5-7-10V6l7-4z"/>

                <path d="M9 12l2 2 4-4"/>

            </svg>

        </div>


        <div class="live-badge mb-3">

            <span class="live-dot"></span>

            LIVE ACCESS

        </div>


        <h1 class="text-3xl font-extrabold text-white tracking-tight">
            Get Access
        </h1>


        <p class="text-sm text-slate-400 mt-2">
            Your all companies franchise link
        </p>

    </div>


    <form id="whatsappForm" class="space-y-5">


        <div>

            <label class="block text-sm font-medium text-slate-300 mb-2">

                पूरा नाम

                <span class="text-slate-500">
                    (Full Name)
                </span>

            </label>


            <input
                type="text"
                id="name"
                required
                autocomplete="name"
                placeholder="अपना नाम दर्ज करें"
                class="
                    premium-input
                    w-full
                    px-4
                    py-3.5
                    bg-slate-950/70
                    border
                    border-slate-700
                    rounded-2xl
                    focus:outline-none
                    focus:ring-2
                    focus:ring-emerald-500
                    text-slate-100
                    placeholder:text-slate-600
                "
            >

        </div>


        <div>

            <label class="block text-sm font-medium text-slate-300 mb-2">

                मोबाइल नंबर

                <span class="text-slate-500">
                    (Mobile Number)
                </span>

            </label>


            <input
                type="tel"
                id="mobile"
                required
                inputmode="numeric"
                maxlength="10"
                autocomplete="tel"
                placeholder="10 अंकों का मोबाइल नंबर"
                class="
                    premium-input
                    w-full
                    px-4
                    py-3.5
                    bg-slate-950/70
                    border
                    border-slate-700
                    rounded-2xl
                    focus:outline-none
                    focus:ring-2
                    focus:ring-emerald-500
                    text-slate-100
                    placeholder:text-slate-600
                "
            >

        </div>


        <button
            type="submit"
            id="submitBtn"
            class="
                premium-button
                w-full
                py-4
                text-white
                font-semibold
                rounded-2xl
                transition
                duration-200
                flex
                items-center
                justify-center
                space-x-2
            "
        >

            <span id="btnText">
                Submit
            </span>

            <span
                id="loader"
                class="
                    hidden
                    animate-spin
                    rounded-full
                    h-5
                    w-5
                    border-b-2
                    border-white
                "
            ></span>

        </button>

    </form>


    <div
        id="statusMessage"
        class="mt-4 text-center text-sm hidden"
    ></div>


    <div class="bottom-info mt-7 pt-5">

        <div class="flex items-center justify-center gap-4">

            <span class="info-item">
                <span class="info-check">✓</span>
                Secure
            </span>

            <span class="info-item">
                <span class="info-check">✓</span>
                Fast Access
            </span>

            <span class="info-item">
                <span class="info-check">✓</span>
                WhatsApp
            </span>

        </div>

    </div>

</div>


<script>


/* =========================================================
   GOOGLE APPS SCRIPT URL
   आपके द्वारा दिया गया URL
========================================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbza1BVVjZeD8LCTNB0YBVoP1dp5rpPSej0nNDkegZlT0tknueOVbT2NmGBxVfePV95VHQ/exec";


/* =========================================================
   WHATSAPP NUMBER
========================================================= */

const WHATSAPP_NUMBER =
"919428327349";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
document.getElementById("whatsappForm");

const nameInput =
document.getElementById("name");

const mobileInput =
document.getElementById("mobile");

const submitBtn =
document.getElementById("submitBtn");

const btnText =
document.getElementById("btnText");

const loader =
document.getElementById("loader");


/* =========================================================
   MOBILE NUMBER
========================================================= */

mobileInput.addEventListener(
    "input",
    function() {

        this.value =
            this.value
            .replace(/\D/g, "")
            .slice(0, 10);

    }
);


/* =========================================================
   WHATSAPP MESSAGE
========================================================= */

function createWhatsappMessage(
    name,
    mobile
) {

    return `*Sep Month Live Campaign*

1.*Angel one*
https://a.aonelink.in/ANGOne/1yV1IIa?utm_source=other&utm_medium=Aman&utm_campaign=Pradhan


2.*Motilal*
https://form.responsebee.com/form-1786444004965


3.*Upstox app*
https://l.zed1corp.com/601662

4.*Hdfc sky*
https://l.zed1corp.com/600220



5.*Stocko*
https://form.responsebee.com/form-1788263666329


6.*Airtel payment bank*
Completed

7.*Groww*
Completed

8.*Bajaj Dt*
Completed 

9.*Choice*
https://form.responsebee.com/form-1786444201481

10.*5 Paisa*
Completed  

User Details:
Name: ${name}
Mobile: ${mobile}`;

}


/* =========================================================
   GOOGLE SHEET SAVE
========================================================= */

function saveToGoogleSheet(
    name,
    mobile
) {

    const data =
        JSON.stringify({
            name: name,
            mobile: mobile
        });


    try {

        const blob =
            new Blob(
                [data],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );


        const sent =
            navigator.sendBeacon(
                GOOGLE_SCRIPT_URL,
                blob
            );


        if (sent) {

            console.log(
                "Google Sheet request sent."
            );

            return;

        }

    } catch (error) {

        console.log(
            "sendBeacon failed:",
            error
        );

    }


    /* Fallback */

    fetch(
        GOOGLE_SCRIPT_URL,
        {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type":
                    "text/plain;charset=utf-8"
            },
            body: data,
            keepalive: true
        }
    )
    .catch(
        error =>
            console.log(
                "Background save error:",
                error
            )
    );

}


/* =========================================================
   OPEN WHATSAPP
========================================================= */

function openWhatsApp(message) {

    const encodedMessage =
        encodeURIComponent(message);


    const nativeWhatsApp =
        `whatsapp://send?phone=${WHATSAPP_NUMBER}&text=${encodedMessage}`;


    const webWhatsApp =
        `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;


    /* First try native WhatsApp */

    window.location.href =
        nativeWhatsApp;


    /*
       Fallback if native app does not open.
    */

    setTimeout(
        function() {

            window.location.href =
                webWhatsApp;

        },
        700
    );

}


/* =========================================================
   FORM SUBMIT
========================================================= */

form.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        const name =
            nameInput.value.trim();


        const mobile =
            mobileInput.value.trim();


        /* NAME */

        if (!name) {

            alert(
                "कृपया अपना नाम डालें।"
            );

            return;

        }


        /* MOBILE */

        if (!/^\d{10}$/.test(mobile)) {

            alert(
                "कृपया सही 10 अंकों का मोबाइल नंबर डालें।"
            );

            return;

        }


        /* BUTTON */

        submitBtn.disabled =
            true;

        btnText.textContent =
            "WhatsApp खुल रहा है...";

        loader.classList.remove(
            "hidden"
        );


        /* SAVE */

        saveToGoogleSheet(
            name,
            mobile
        );


        /* MESSAGE */

        const message =
            createWhatsappMessage(
                name,
                mobile
            );


        /* WHATSAPP */

        openWhatsApp(
            message
        );


        /* RESET */

        setTimeout(
            function() {

                submitBtn.disabled =
                    false;

                btnText.textContent =
                    "सबमिट करें & WhatsApp पर जाएँ";

                loader.classList.add(
                    "hidden"
                );

            },
            2000
        );

    }
);

</script>


</body>

</html>
