<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - WhatsApp & Google Sheet</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- =========================================================
         ONLY DESIGN / ANIMATION CSS
         JAVASCRIPT BELOW IS YOUR ORIGINAL JAVASCRIPT
    ========================================================== -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 10%, rgba(16,185,129,0.18), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(59,130,246,0.16), transparent 30%),
                linear-gradient(135deg, #020617 0%, #071b1c 50%, #020617 100%);
        }

        /* Moving background lights */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: -1;
            animation: floatingLight 8s ease-in-out infinite;
        }

        body::before {
            background: rgba(16,185,129,0.22);
            top: -100px;
            left: -100px;
        }

        body::after {
            background: rgba(59,130,246,0.18);
            right: -100px;
            bottom: -100px;
            animation-delay: -4s;
        }

        @keyframes floatingLight {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(30px, -20px) scale(1.12);
            }
        }

        /* Main card */
        .premium-card {
            position: relative;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow:
                0 30px 80px rgba(0,0,0,0.50),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardAppear 0.75s ease-out;
        }

        .premium-card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(16,185,129,0.10);
            filter: blur(45px);
            top: -90px;
            right: -70px;
            pointer-events: none;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Top icon */
        .top-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow:
                0 15px 35px rgba(16,185,129,0.28),
                inset 0 1px 0 rgba(255,255,255,0.25);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* Live badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 11px;
            border-radius: 999px;
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.20);
            color: #34d399;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(52,211,153,0.7);
            }
            70% {
                box-shadow: 0 0 0 7px rgba(52,211,153,0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(52,211,153,0);
            }
        }

        /* Inputs */
        .premium-input {
            transition: all 0.25s ease;
        }

        .premium-input:hover {
            border-color: rgba(100,116,139,0.8);
        }

        .premium-input:focus {
            transform: translateY(-2px);
            border-color: #10b981 !important;
            box-shadow:
                0 0 0 4px rgba(16,185,129,0.10),
                0 10px 30px rgba(0,0,0,0.18);
        }

        /* Submit button */
        .premium-button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow:
                0 12px 30px rgba(16,185,129,0.22),
                inset 0 1px 0 rgba(255,255,255,0.18);
            transition: all 0.25s ease;
        }

        .premium-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            width: 70%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.30),
                transparent
            );
            transform: skewX(-20deg);
            animation: buttonShine 3.5s infinite;
        }

        @keyframes buttonShine {
            0% {
                left: -130%;
            }
            35%, 100% {
                left: 150%;
            }
        }

        .premium-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 17px 40px rgba(16,185,129,0.32),
                inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .premium-button:active {
            transform: translateY(0) scale(0.99);
        }

        .premium-button:disabled {
            cursor: not-allowed;
            transform: none;
            opacity: 0.75;
        }

        /* Bottom information */
        .bottom-info {
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .info-item {
            color: #64748b;
            font-size: 11px;
        }

        .info-check {
            color: #34d399;
            margin-right: 3px;
        }

        @media (max-width: 480px) {
            .premium-card {
                border-radius: 25px;
                padding: 24px !important;
            }

            .top-icon {
                width: 62px;
                height: 62px;
                border-radius: 19px;
            }
        }
    </style>
</head>

    <script>

        document.getElementById('whatsappForm').addEventListener('submit', async function(e) {

            const submitBtn = document.getElementById('submitBtn');

            btnText.textContent = "डेटा सेव हो रहा है...";

                // doPost() Apps Script me maujood hai to request server tak pahunch jaati hai
