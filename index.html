<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Access - Live Campaign</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 20% 20%, rgba(16,185,129,.18), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(59,130,246,.18), transparent 30%),
                linear-gradient(135deg, #020617, #071a1b, #020617);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            z-index: -1;
            animation: floatOrb 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 220px;
            height: 220px;
            background: #10b981;
            top: -70px;
            left: -70px;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: #2563eb;
            bottom: -100px;
            right: -80px;
            animation-delay: -3s;
        }

        @keyframes floatOrb {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(25px, -20px) scale(1.08);
            }
        }

        /* Main Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,.10);
            box-shadow:
                0 25px 70px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.05);
            animation: cardIn .7s ease-out;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo Icon */
        .access-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow:
                0 12px 35px rgba(16,185,129,.30),
                inset 0 1px 0 rgba(255,255,255,.25);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: translateY(0);
                box-shadow: 0 12px 35px rgba(16,185,129,.30);
            }
            50% {
                transform: translateY(-5px);
                box-shadow: 0 18px 45px rgba(16,185,129,.45);
            }
        }

        /* Inputs */
        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            transition: .25s;
        }

        .modern-input {
            width: 100%;
            padding: 15px 16px 15px 48px;
            background: rgba(2, 6, 23, .65);
            border: 1px solid rgba(100,116,139,.35);
            border-radius: 15px;
            color: #f8fafc;
            outline: none;
            transition: all .25s ease;
        }

        .modern-input::placeholder {
            color: #64748b;
        }

        .modern-input:focus {
            border-color: #10b981;
            background: rgba(2, 6, 23, .9);
            box-shadow:
                0 0 0 4px rgba(16,185,129,.10),
                0 8px 25px rgba(0,0,0,.15);
            transform: translateY(-1px);
        }

        .modern-input:focus + .input-icon {
            color: #10b981;
        }

        /* Submit Button */
        .submit-button {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 12px 30px rgba(16,185,129,.25);
            transition: all .25s ease;
        }

        .submit-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.25),
                transparent
            );
            transform: skewX(-20deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% {
                left: -120%;
            }
            35%, 100% {
                left: 140%;
            }
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 17px 38px rgba(16,185,129,.35);
        }

        .submit-button:active {
            transform: translateY(0) scale(.99);
        }

        .submit-button:disabled {
            opacity: .75;
            cursor: not-allowed;
            transform: none;
        }

        /* Small Features */
        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 12px;
        }

        .feature-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px rgba(16,185,129,.7);
        }

        /* Status */
        .status-box {
            padding: 12px;
            border-radius: 12px;
            background: rgba(2,6,23,.45);
        }

        /* Mobile */
        @media (max-width: 480px) {
            .glass-card {
                padding: 24px !important;
                border-radius: 24px;
            }

            .access-icon {
                width: 60px;
                height: 60px;
                border-radius: 19px;
            }
        }
    </style>
</head>
