<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #020617;
        }

        /* Animated background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(16,185,129,.18), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(59,130,246,.18), transparent 30%),
                #020617;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            animation: move 8s infinite ease-in-out;
        }

        .circle.one {
            width: 220px;
            height: 220px;
            background: #10b981;
            top: -80px;
            left: -70px;
        }

        .circle.two {
            width: 250px;
            height: 250px;
            background: #2563eb;
            right: -100px;
            bottom: -80px;
            animation-delay: -3s;
        }

        .circle.three {
            width: 150px;
            height: 150px;
            background: #8b5cf6;
            left: 45%;
            top: 35%;
            animation-delay: -5s;
        }

        @keyframes move {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(25px, -25px) scale(1.12);
            }
        }

        /* Card animation */
        .main-card {
            animation: cardAppear .7s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Icon */
        .access-icon {
            animation: iconFloat 3s infinite ease-in-out;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* Input animation */
        .input-box {
            transition: .25s ease;
        }

        .input-box:focus {
            transform: translateY(-2px);
        }

        /* Button shine animation */
        .submit-button {
            position: relative;
            overflow: hidden;
            transition: all .25s ease;
        }

        .submit-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: rgba(255,255,255,.20);
            transform: skewX(-25deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% {
                left: -120%;
            }

            35%, 100% {
                left: 140%;
            }
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(16,185,129,.35);
        }

        .submit-button:active {
            transform: scale(.98);
        }

        /* Live badge */
        .live-dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16,185,129,.7);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(16,185,129,0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16,185,129,0);
            }
        }
    </style>
</head>
